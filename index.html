<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토토 예측</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="토토 예측">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #2563eb; color: #fff; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  .box { width: min(360px, calc(100% - 32px)); text-align: center; padding: 24px 0; }
  img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  h1 { font-size: 1.4rem; margin: 16px 0 6px; }
  p { margin: 6px 0; opacity: .9; font-size: .95rem; line-height: 1.5; }
  .hide { display: none; }
  form { margin-top: 18px; }
  input, button { width: 100%; box-sizing: border-box; font-size: 1.05rem; padding: 14px; border-radius: 12px; border: 0; }
  input { margin-bottom: 10px; color: #111; }
  button { background: #facc15; color: #111; font-weight: 700; cursor: pointer; }
  button.ghost { background: rgba(255,255,255,.18); color: #fff; margin-top: 10px; }
  .card { background: rgba(255,255,255,.14); border-radius: 14px; padding: 14px 16px; margin-top: 18px; text-align: left; }
  .card b { display: block; margin-bottom: 6px; }
  .card ol { margin: 0; padding-left: 20px; line-height: 1.7; font-size: .92rem; }
  .ok { color: #bbf7d0; font-weight: 700; }
  a { color: #fff; font-size: .85rem; opacity: .85; }
</style>
</head>
<body>
<div class="box">
  <img src="icon-192.png" alt="">
  <h1>토토 예측</h1>
  <p id="msg">여는 중...</p>

  <!-- 1단계: 비밀번호 (처음 한 번) -->
  <form id="f" class="hide">
    <input id="pw" type="password" placeholder="앱 비밀번호" autocomplete="current-password" required>
    <button type="submit">저장</button>
    <p>비밀번호 자체는 저장하지 않고, 암호화된 값만 이 휴대폰에 저장합니다.</p>
  </form>

  <!-- 2단계: 브라우저에서 열었을 때 — 설치 안내 -->
  <div id="install" class="hide">
    <p class="ok">✓ 자동 로그인이 설정됐습니다</p>
    <button id="installBtn" class="hide" type="button">홈 화면에 설치</button>
    <div class="card" id="guide">
      <b>홈 화면에 아이콘 만들기 (이 화면에서 하세요)</b>
      <ol id="steps"></ol>
    </div>
    <button class="ghost" id="openBtn" type="button">앱 바로 열기</button>
    <p style="margin-top:14px"><a href="?reset">비밀번호 다시 입력</a></p>
  </div>

  <p id="relink" class="hide" style="margin-top:18px"><a href="?reset">비밀번호 다시 입력</a></p>
</div>
<script>
// 흐름: 브라우저로 이 페이지를 열면 비밀번호 저장 → 설치 안내만 보여주고 넘어가지 않는다.
//       홈 화면 아이콘(standalone 또는 ?launch)으로 열면 곧바로 앱으로 이동한다.
// 토큰 = HMAC-SHA256(비밀번호, "sportstoto-login") 앞 32자. app/dashboard.py 의 login_token() 과 같아야 한다.
const APP = "https://sportstoto-pj.streamlit.app/";
const KEY = "toto_login_token";
const $ = (id) => document.getElementById(id);

function store(op, v) {
  try {
    if (op === "get") return localStorage.getItem(KEY);
    if (op === "set") localStorage.setItem(KEY, v);
    if (op === "del") localStorage.removeItem(KEY);
  } catch (e) { return null; }
}

function go(token) {
  location.replace(token ? APP + "?k=" + encodeURIComponent(token) : APP);
}

async function makeToken(pw) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(pw), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, enc.encode("sportstoto-login"));
  return [...new Uint8Array(sig)].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 32);
}

const params = new URLSearchParams(location.search);
const launched = params.has("launch") ||
  window.matchMedia("(display-mode: standalone)").matches ||
  window.matchMedia("(display-mode: fullscreen)").matches ||
  window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

if (params.has("reset")) { store("del"); history.replaceState(null, "", location.pathname + (launched ? "?launch" : "")); }

// 안드로이드 Chrome: 설치 버튼을 직접 띄울 수 있으면 사용
let deferred = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); deferred = e;
  $("installBtn").classList.remove("hide");
});
$("installBtn").addEventListener("click", async () => {
  if (!deferred) return;
  deferred.prompt();
  await deferred.userChoice;
  deferred = null;
  $("installBtn").classList.add("hide");
});
$("openBtn").addEventListener("click", () => go(store("get")));

function showInstall() {
  $("msg").textContent = "";
  $("steps").innerHTML = isIOS
    ? "<li><b style='display:inline'>Safari</b>로 이 주소를 엽니다</li><li>아래 <b style='display:inline'>공유</b> 버튼(네모+화살표)</li><li><b style='display:inline'>홈 화면에 추가</b> → 추가</li>"
    : "<li>위 <b style='display:inline'>홈 화면에 설치</b> 버튼을 누르거나</li><li>오른쪽 위 <b style='display:inline'>⋮</b> → <b style='display:inline'>앱 설치</b>(또는 홈 화면에 추가)</li><li>파란 <b style='display:inline'>토토</b> 아이콘이 생기면 완료</li><li>예전 Streamlit 아이콘은 지우세요</li>";
  $("install").classList.remove("hide");
}

function askPassword() {
  $("msg").textContent = "앱 비밀번호를 한 번만 입력하세요.";
  $("f").classList.remove("hide");
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const token = await makeToken($("pw").value);
    store("set", token);
    $("f").classList.add("hide");
    if (launched) go(token); else showInstall();
  });
}

const saved = store("get");
if (!window.crypto || !crypto.subtle) {
  go(null); // 암호화 기능이 없는 브라우저: 앱에서 직접 로그인
} else if (!saved) {
  askPassword();
} else if (launched) {
  $("relink").classList.remove("hide"); // 비밀번호를 바꿨을 때 다시 설정할 수 있도록 잠깐 보여줌
  setTimeout(() => go(saved), 600);
} else {
  showInstall();
}
</script>
</body>
</html>
